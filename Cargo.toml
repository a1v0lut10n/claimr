[package]
name = "claimr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "Claimr — a constraint logic programming language, Prolog III inspired, parsed with a rustemo-generated LR parser."
repository = "https://github.com/a1v0lut10n/claimr"
license = "Apache-2.0"
readme = "README.md"
keywords = ["constraint", "logic-programming", "prolog", "parser", "rustemo"]
categories = ["parser-implementations", "compilers"]
# The crate ships the source, examples (the tests parse and run them), README,
# LICENSE and NOTICE; the documentation workflow tree and branding raster are
# repository-only.
exclude = ["docs/", "CLAUDE.md", "static/img/claimr-logo.png", ".claude/"]

[lib]
name = "claimr"
path = "src/lib.rs"

[[bin]]
name = "claimr"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
rustemo = "0.9.1"
rustyline = "18"
ctrlc = "3"
thiserror = "1"

[build-dependencies]
rustemo-compiler = "0.9.1"
