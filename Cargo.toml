[package]
name = "claimr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Aivolution GmbH"]
description = "Claimr — a constraint logic programming language, Prolog III inspired, parsed with nom."
repository = "https://github.com/a1v0lut10n/claimr"
license = "MIT"
readme = "README.md"
keywords = ["constraint", "logic-programming", "prolog", "parser", "nom"]
categories = ["parser-implementations", "compilers"]

[lib]
name = "claimr"
path = "src/lib.rs"

[[bin]]
name = "claimr"
path = "src/main.rs"

[dependencies]
nom = "7"
thiserror = "1"
