[package]
name = "claimr"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "Claimr — a constraint logic programming language, Prolog III inspired, parsed with a rustemo-generated LR parser."
repository = "https://github.com/a1v0lut10n/claimr"
license = "Apache-2.0"
readme = "README.md"
keywords = ["constraint", "logic-programming", "prolog", "parser", "rustemo"]
categories = ["parser-implementations", "compilers"]
# The crate ships the source, examples (the tests parse and run them), README,
# LICENSE and NOTICE; the documentation workflow tree and branding raster are
# repository-only.
exclude = ["docs/", "CLAUDE.md", "static/img/claimr-logo.png", ".claude/"]

[lib]
name = "claimr"
path = "src/lib.rs"

[[bin]]
name = "claimr"
path = "src/main.rs"
required-features = ["cli"]

# The tests that drive the binary (through `CARGO_BIN_EXE_claimr`) need the
# feature too; the library's tests are discovered as usual (CLM-0038).
[[test]]
name = "run_examples"
required-features = ["cli"]

[[test]]
name = "json_output"
required-features = ["cli"]

[[test]]
name = "repl"
required-features = ["cli"]

[[test]]
name = "benchmarks"
required-features = ["cli"]

[features]
# `cli` owns the command line's dependencies — the REPL's line editor and
# the Ctrl-C handler — and the binary requires it. A program that embeds
# the engine depends on `claimr` with `default-features = false`
# (CLM-0038, docs/implementation/2026-11-22-clm-0038-cli-feature.md).
default = ["cli"]
cli = ["dep:rustyline", "dep:ctrlc"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
rustemo = "0.9.1"
rustyline = { version = "18", optional = true }
ctrlc = { version = "3", optional = true }
thiserror = "1"

[build-dependencies]
rustemo-compiler = "0.9.1"
